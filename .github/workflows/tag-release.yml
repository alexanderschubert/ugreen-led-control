name: Tag release

# The .plg downloads its files from the tag v<version> and the ugreen-led-i2c
# binary from the release of that tag, each checked against its <MD5>. So the
# binary is built and checked first, then the tag and the release are made;
# an existing release asset is never replaced.
on:
  push:
    branches: [main]
    paths: [plugin/ugreen-led-control.plg]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.22.12'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the plugin version
        id: version
        run: |
          version="$(sed -n 's/^<!ENTITY version *"\([^"]*\)">.*/\1/p' plugin/ugreen-led-control.plg)"
          if [ -z "$version" ]; then
            echo "::error::No version entity found in plugin/ugreen-led-control.plg"
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build ugreen-led-i2c
        working-directory: i2c
        run: |
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags "-s -w" -o ugreen-led-i2c .

      - name: Check the MD5 of every download in the .plg
        run: python3 scripts/plg-hashes.py plugin/ugreen-led-control.plg --binary ugreen-led-i2c=i2c/ugreen-led-i2c --check

      - name: Create the tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} already exists."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "UGREEN LED Control ${TAG#v}"
          git push origin "${TAG}"
          echo "Created ${TAG}."

      - name: Create the release with the binary
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" i2c/ugreen-led-i2c --title "UGREEN LED Control ${TAG#v}" --notes "Plugin version ${TAG#v}. Install: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/plugin/ugreen-led-control.plg"
          elif gh release view "${TAG}" --json assets -q '.assets[].name' | grep -qx ugreen-led-i2c; then
            echo "${TAG} already has ugreen-led-i2c; it stays as it is (installs check its MD5)."
          else
            gh release upload "${TAG}" i2c/ugreen-led-i2c
          fi
