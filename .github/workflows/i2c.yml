name: I2C tool

on:
  push:
    branches: [main]
    paths: [i2c/**, plugin/**, src/**, scripts/plg-hashes.py, scripts/i18n.py, .github/workflows/i2c.yml]
  pull_request:
    paths: [i2c/**, plugin/**, src/**, scripts/plg-hashes.py, scripts/i18n.py, .github/workflows/i2c.yml]

permissions:
  contents: read

concurrency:
  group: i2c-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Same Go (from i2c/go.mod) and flags as "Tag release": the build is reproducible,
# so the MD5 in the .plg can be checked here before the release binary exists.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: i2c/go.mod
          cache-dependency-path: i2c/go.mod

      - working-directory: i2c
        run: |
          gofmt -l . | tee /dev/stderr | (! read -r)
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          go test ./...

      # Static binary: runs on every Unraid kernel without libraries.
      - working-directory: i2c
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags "-s -w" -o ugreen-led-i2c .

      - uses: actions/upload-artifact@v7
        with:
          name: ugreen-led-i2c
          path: i2c/ugreen-led-i2c

      - name: Check the interface texts (keys, placeholders, HTML)
        run: python3 scripts/i18n.py check

      - name: Check the MD5 of every download in the .plg
        run: python3 scripts/plg-hashes.py plugin/ugreen-led-control.plg --binary ugreen-led-i2c=i2c/ugreen-led-i2c --check
